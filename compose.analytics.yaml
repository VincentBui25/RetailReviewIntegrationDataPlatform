# DuckDB/dbt warehouse and read-only BI. PostgreSQL is Superset metadata only.
name: fnb-platform
services:
  postgres:
    image: postgres:15@sha256:3b0d656f5fff31c7d8a64f500a703dcf3f35e98ce78f602831a73059a5e6a012
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnb_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${FNB_POSTGRES_PORT:-15501}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fnb_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [platform]
  analytics-init:
    image: ${FNB_IMAGE_PREFIX:-fnb}/analytics:1.0.0
    build: &warehouse-build {context: ., dockerfile: docker/analytics/Dockerfile, target: warehouse}
    user: "50000:0"
    profiles: [tools]
    entrypoint: [/usr/local/bin/python, -B, /app/scripts/bootstrap_analytics.py]
    volumes: ["./scripts:/app/scripts:ro"]
    secrets: [admin_password, superset_metadata_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [platform]
  analytics-build:
    image: ${FNB_IMAGE_PREFIX:-fnb}/analytics:1.0.0
    build: *warehouse-build
    user: "50000:0"
    profiles: [tools]
    entrypoint: [/usr/local/bin/python, -B, -m, fnb_platform.analytics.warehouse]
    environment: {PYTHONPATH: "/app/src:/app", PYTHONDONTWRITEBYTECODE: "1", DBT_SEND_ANONYMOUS_USAGE_STATS: "false"}
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./pipelines:/app/pipelines:ro
      - ./config:/app/config:ro
      - ./docker/analytics:/app/docker/analytics:ro
      - demo_outputs:/demo:ro
      - ${FNB_BUSINESS_INPUT_ROOT:-./.local/inputs/business}:/business-input:ro
      - ${FNB_DEMOGRAPHICS_INPUT_ROOT:-./.local/inputs/demographics}:/area-input:ro
      - ${FNB_ANALYTICS_OUTPUT:-./.local/duckdb-final/output}:/analytics-out
    networks: [platform]
  superset-init: &superset
    image: ${FNB_IMAGE_PREFIX:-fnb}/superset-duckdb:6.0.0
    build: {context: ./docker/analytics, target: superset-duckdb}
    user: "superset"
    profiles: [tools]
    entrypoint: [/bin/sh, -c]
    command: ["superset db upgrade && superset init && python /workspace/docker/analytics/configure_superset.py"]
    environment:
      SUPERSET_CONFIG_PATH: /workspace/docker/analytics/superset_config.py
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./docker/analytics:/workspace/docker/analytics:ro
      - superset_home:/app/superset_home
      - ${FNB_ANALYTICS_OUTPUT:-./.local/duckdb-final/output}:/analytics-out
    secrets: [superset_metadata_password, superset_secret_key, superset_admin_password]
    networks: [platform]
  superset:
    <<: *superset
    profiles: []
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [superset_metadata_password, superset_secret_key]
    entrypoint: [gunicorn]
    command: [--bind, "0.0.0.0:8088", --workers, "1", --threads, "4", --worker-class, gthread, --timeout, "120", "superset.app:create_app()"]
    ports: ["127.0.0.1:${FNB_SUPERSET_PORT:-18101}:8088"]
    volumes:
      - ./docker/analytics:/workspace/docker/analytics:ro
      - superset_home:/app/superset_home
      - ${FNB_ANALYTICS_OUTPUT:-./.local/duckdb-final/output}:/analytics-out:ro
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 18
  dbt-docs:
    image: ${FNB_IMAGE_PREFIX:-fnb}/analytics:1.0.0
    build: *warehouse-build
    user: "50000:0"
    entrypoint: [python, -B, /app/scripts/dbt_docs.py]
    command: [--project, "${FNB_DBT_DOCS_PROJECT:-dimensional_analytics}", --serve]
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./pipelines:/app/pipelines:ro
      - ./config:/app/config:ro
      - demo_outputs:/demo:ro
      - ${FNB_BUSINESS_INPUT_ROOT:-./.local/inputs/business}:/business-input:ro
      - ${FNB_AREA_RELEASES_ROOT:-./output/area-enrichment-staging-v1}:/area-dbt-input:ro
      - ${FNB_ANALYTICS_OUTPUT:-./.local/duckdb-final/output}:/analytics-out
    environment: {PYTHONPATH: "/app/src:/app", PYTHONDONTWRITEBYTECODE: "1", DBT_SEND_ANONYMOUS_USAGE_STATS: "false", FNB_AREA_DBT_RELEASE: "${FNB_AREA_DBT_RELEASE:-}"}
    ports: ["127.0.0.1:${FNB_DBT_DOCS_PORT:-18102}:8081"]
    networks: [platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://localhost:8081',timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 24
  bi-verify:
    image: ${FNB_IMAGE_PREFIX:-fnb}/bi-verify:1.0.0
    build: {context: ., dockerfile: docker/analytics/Dockerfile, target: verification}
    profiles: [tools]
    user: "50000:0"
    shm_size: 512mb
    # This browser sidecar shares the server's network namespace. Its loopback
    # origin matches the real localhost UI and the basemap's local-dev contract.
    network_mode: "service:superset"
    depends_on:
      superset: {condition: service_healthy}
    command: [--url, "http://127.0.0.1:8088", --output, /verification-out/browser]
    environment: {FNB_ANALYTICS_OUTPUT: /analytics-out, FNB_SECRETS_ROOT: /run/secrets}
    volumes:
      - ${FNB_ANALYTICS_OUTPUT:-./.local/duckdb-final/output}:/analytics-out:ro
      - ${FNB_VERIFICATION_OUTPUT:-./.local/duckdb-final/verification}:/verification-out
    secrets: [superset_admin_password]
volumes:
  postgres_data:
  demo_outputs:
    name: ${FNB_DEMO_VOLUME:-fnb-platform_demo_outputs}
  superset_home:
networks:
  platform:
secrets:
  admin_password: {file: "${FNB_SECRETS_ROOT:-./.auth/fnb}/admin_password"}
  superset_metadata_password: {file: "${FNB_SECRETS_ROOT:-./.auth/fnb}/superset_metadata_password"}
  superset_secret_key: {file: "${FNB_SECRETS_ROOT:-./.auth/fnb}/superset_secret_key"}
  superset_admin_password: {file: "${FNB_SECRETS_ROOT:-./.auth/fnb}/superset_admin_password"}
